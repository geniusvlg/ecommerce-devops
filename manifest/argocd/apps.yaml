################################ ARGOCD ################################

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: springboot-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://gitlab.com/shopping-cart796042412/devops/shoppingcart-manifest.git"
    targetRevision: main
    path: springboot-microservices
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: springboot-microservices
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true